<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 - 비유트립 파트너스</title>
    <!-- 파비콘 추가 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF5A79'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='800' font-size='40'%3EB%3C/text%3E%3C/svg%3E"> 
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FF5A79', light: '#FF889F', dark: '#E0415F', 50: '#FFF0F3', 100: '#FFE1E7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }

        /* 퀵 메뉴 CSS 추가 */
        .quick {
            position: fixed; right: 26px; top: 50%; translate: 0 -50%; z-index: 90;
            display: flex; flex-direction: column; gap: 10px;
            opacity: 0; visibility: hidden; transform: translateX(14px);
            transition: opacity 0.4s, transform 0.4s, visibility 0.4s;
        }
        .quick.show { opacity: 1; visibility: visible; transform: none; }
        .quick a, .quick button {
            width: 84px; padding: 19px 8px; border-radius: 20px; text-decoration: none;
            display: flex; flex-direction: column; align-items: center; gap: 9px; cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 800; line-height: 1.35; text-align: center;
            transition: transform 0.25s;
        }
        .quick a:hover, .quick button:hover { transform: translateY(-3px); }
        .q-main {
            background: var(--brand, #FF5A79); color: #fff; border: 0;
            box-shadow: 0 16px 34px -12px rgba(255,90,121,0.6);
            animation: qb 2.8s ease-in-out infinite;
        }
        @keyframes qb {
            0%, 100% { box-shadow: 0 16px 34px -12px rgba(255,90,121,0.55); }
            50% { box-shadow: 0 18px 44px -10px rgba(255,90,121,0.95); }
        }
        .q-sub, .q-top {
            background: #fff; color: #111827; border: 1px solid #d1d5db;
            box-shadow: 0 14px 30px -16px rgba(17,24,39,0.35);
        }
        .q-top {
            color: #6b7280; padding: 15px 8px; font-size: 12px; letter-spacing: 0.1em;
        }
        @media (max-width: 900px) {
            .quick {
                right: 14px; top: auto; bottom: 18px; translate: 0 0; flex-direction: row;
            }
            .quick a, .quick button {
                width: auto; flex-direction: row; padding: 15px 20px; border-radius: 999px; font-size: 14px;
            }
            .q-top { display: none; }
        }
    </style>
</head>
<body class="text-gray-800 pt-20">

    <!-- 1. 네비게이션 바 -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300" id="main-header">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="location.href='index.html'">
                    <div class="w-8 h-8 bg-brand text-white font-bold text-xl flex items-center justify-center rounded-md mr-2">B</div>
                    <span class="font-black text-2xl tracking-tighter text-gray-900">beyoutrip <span class="text-brand font-bold text-lg">파트너스</span></span>
                </div>
                <nav class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-600 font-medium hover:text-brand transition">회사소개</a>
                    <div class="relative group py-6">
                        <a href="#" class="text-gray-600 font-medium hover:text-brand transition flex items-center">
                            마케팅서비스
                            <i class="fa-solid fa-chevron-down w-3 h-3 ml-1 text-gray-400 group-hover:text-brand transition"></i>
                        </a>
                        <div class="absolute left-1/2 transform -translate-x-1/2 mt-4 w-32 bg-white rounded-xl shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 overflow-hidden">
                            <a href="attract.html" class="block px-4 py-3 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand transition text-center">고객유치</a>
                            <div class="border-b border-gray-50"></div>
                            <a href="agency.html" class="block px-4 py-3 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand transition text-center">마케팅대행</a>
                        </div>
                    </div>
                    <a href="column.html" class="text-brand font-bold transition">칼럼</a>
                    <a href="contact.html" class="text-gray-600 font-medium hover:text-brand transition">문의하기</a>
                    <a href="contact.html" class="bg-brand text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-brand-dark transition shadow-lg shadow-brand/30">상담하기</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section id="hero" class="bg-gray-900 text-white py-16 text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-4">비유트립 마케팅 인사이트</h1>
        <p class="text-gray-400">글로벌 고객 유치를 위한 최신 트렌드와 성공 노하우를 전해드립니다.</p>
    </section>

    <!-- 칼럼 리스트 -->
    <section class="py-16 px-4 max-w-7xl mx-auto">
        <!-- 관리자 글쓰기 버튼 -->
        <div class="flex justify-end mb-6">
            <a href="admin-write.html" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-black transition">
                <i class="fa-solid fa-pen mr-1"></i> 관리자 글쓰기
            </a>
        </div>

        <!-- 게시글이 렌더링될 영역 -->
        <div id="post-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-3 text-center py-20 text-gray-400 font-medium">게시글을 불러오는 중입니다...</div>
        </div>
    </section>

    <!-- 퀵 메뉴 (스크롤 시 표시) -->
    <nav class="quick" aria-label="빠른 메뉴">
        <a class="q-main" href="https://pf.kakao.com/_xcVewn" target="_blank" rel="noopener">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4c-1.3 0-2.6-.3-3.7-.8L3 21l1.9-5.1A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/></svg>
            카톡상담
        </a>
        <a class="q-sub" href="https://www.instagram.com/beyoutrip_business/" target="_blank" rel="noopener">Instagram</a>
        <a class="q-sub" href="https://blog.naver.com/y6gaao" target="_blank" rel="noopener">Blog</a>
        <button class="q-top" type="button" aria-label="맨 위로">TOP</button>
    </nav>

    <!-- 스크립트 영역 -->
    <script>
        // Supabase 설정
        const SUPABASE_URL = 'https://xzabrhkfnrnfjgvcynfh.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_BP2LaVSG026H7MblpF3AWQ_s93WlBrG';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            fetchPosts();
        });

        // Supabase에서 글 목록 불러오기
        async function fetchPosts() {
            const grid = document.getElementById('post-grid');
            
            const { data: posts, error } = await supabaseClient
                .from('posts')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error('Error fetching posts:', error);
                grid.innerHTML = '<div class="col-span-3 text-center py-20 text-red-400">게시글을 불러오지 못했습니다.</div>';
                return;
            }

            grid.innerHTML = '';

            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="col-span-3 text-center py-20 text-gray-400 font-medium">등록된 칼럼이 없습니다.</div>';
                return;
            }

            posts.forEach(post => {
                const plainText = post.content ? post.content.replace(/(<([^>]+)>)/gi, "") : "";
                
                grid.innerHTML += `
                <article class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-200 hover:shadow-xl hover:border-brand-100 transition duration-300 flex flex-col group">
                    <a href="column-detail.html?id=${post.id}" class="block flex-1 flex flex-col cursor-pointer">
                        <div class="h-56 bg-gray-200 overflow-hidden relative">
                            <img src="${post.thumbnail}" alt="썸네일" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <span class="absolute top-4 left-4 bg-brand text-white text-xs font-bold px-3 py-1 rounded-full">${post.category}</span>
                        </div>
                        <div class="p-6 flex-1 flex flex-col">
                            <h3 class="text-xl font-bold text-gray-900 mb-3 line-clamp-2 group-hover:text-brand transition">${post.title}</h3>
                            <p class="text-gray-500 text-sm mb-4 line-clamp-3 flex-1">${plainText}</p>
                        </div>
                    </a>
                    
                    <div class="px-6 pb-6 flex justify-between items-center text-sm text-gray-400 mt-auto border-t border-gray-50 pt-4">
                        <span>${post.date}</span>
                        <div class="space-x-3">
                            <a href="admin-write.html?id=${post.id}" class="hover:text-brand transition cursor-pointer font-medium">수정</a>
                            <button onclick="deletePost(${post.id})" class="hover:text-red-500 transition cursor-pointer font-medium">삭제</button>
                        </div>
                    </div>
                </article>
                `;
            });
        }

        // Supabase에서 게시글 삭제
        async function deletePost(id) {
            if(confirm('정말 이 칼럼을 삭제하시겠습니까?')) {
                const { error } = await supabaseClient
                    .from('posts')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('삭제 중 오류가 발생했습니다.');
                    console.error(error);
                } else {
                    fetchPosts();
                }
            }
        }

        // 퀵 메뉴 및 헤더 스크롤 제어
        (function(){
            var h = document.getElementById('main-header'), 
                q = document.querySelector('.quick'), 
                hero = document.getElementById('hero'), 
                tick = false;

            function onScroll(){
                if(tick) return; tick = true;
                requestAnimationFrame(function(){
                    var y = window.scrollY;
                    if (h) {
                        if (y > 8) h.classList.add('shadow-md');
                        else h.classList.remove('shadow-md');
                    }
                    tick = false;
                });
            }
            window.addEventListener('scroll', onScroll, {passive: true}); onScroll();
            
            // 퀵메뉴 표시 (히어로 섹션 지나면 표시)
            if (q) {
                if (hero && 'IntersectionObserver' in window) {
                    new IntersectionObserver(function(e){
                        q.classList.toggle('show', !e[0].isIntersecting);
                    }, { threshold: 0 }).observe(hero);
                } else {
                    q.classList.add('show');
                }
            }

            var qTop = document.querySelector('.q-top');
            if (qTop) {
                qTop.addEventListener('click', function(){
                    window.scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
                });
            }
        })();
    </script>
</body>
</html>
