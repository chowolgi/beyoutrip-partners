<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 - 비유트립 파트너스</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FF5A79', light: '#FF889F', dark: '#E0415F', 50: '#FFF0F3', 100: '#FFE1E7' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body class="text-gray-800 pt-20">

    <!-- 1. 네비게이션 바 -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer" onclick="location.href='index.html'">
                    <div class="w-8 h-8 bg-brand text-white font-bold text-xl flex items-center justify-center rounded-md mr-2">B</div>
                    <span class="font-black text-2xl tracking-tighter text-gray-900">beyoutrip <span class="text-brand font-bold text-lg">파트너스</span></span>
                </div>
                <nav class="hidden md:flex space-x-8 items-center">
                    <a href="index.html" class="text-gray-600 font-medium hover:text-brand transition">회사소개</a>
                    <div class="relative group py-6">
                        <a href="#" class="text-gray-600 font-medium hover:text-brand transition flex items-center">
                            마케팅서비스
                            <i class="fa-solid fa-chevron-down w-3 h-3 ml-1 text-gray-400 group-hover:text-brand transition"></i>
                        </a>
                        <div class="absolute left-1/2 transform -translate-x-1/2 mt-4 w-32 bg-white rounded-xl shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 overflow-hidden">
                            <a href="attract.html" class="block px-4 py-3 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand transition text-center">고객유치</a>
                            <div class="border-b border-gray-50"></div>
                            <a href="agency.html" class="block px-4 py-3 text-sm text-gray-700 hover:bg-brand-50 hover:text-brand transition text-center">마케팅대행</a>
                        </div>
                    </div>
                    <a href="column.html" class="text-gray-600 font-medium hover:text-brand transition">칼럼</a>
                    <a href="contact.html" class="text-gray-600 font-medium hover:text-brand transition">문의하기</a>
                    <a href="contact.html" class="bg-brand text-white px-6 py-2.5 rounded-full text-sm font-bold hover:bg-brand-dark transition shadow-lg shadow-brand/30">상담하기</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- 히어로 섹션 -->
    <section class="bg-gray-900 text-white py-16 text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-4">비유트립 마케팅 인사이트</h1>
        <p class="text-gray-400">글로벌 고객 유치를 위한 최신 트렌드와 성공 노하우를 전해드립니다.</p>
    </section>

    <!-- 칼럼 리스트 -->
    <section class="py-16 px-4 max-w-7xl mx-auto">
        <!-- 관리자 글쓰기 버튼 -->
        <div class="flex justify-end mb-6">
            <a href="admin-write.html" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-black transition">
                <i class="fa-solid fa-pen mr-1"></i> 관리자 글쓰기
            </a>
        </div>

        <!-- 자바스크립트로 게시글이 렌더링될 영역 -->
        <div id="post-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPosts();
        });

        // 로컬 스토리지에서 글 목록을 불러와서 화면에 그리는 함수
        function renderPosts() {
            const grid = document.getElementById('post-grid');
            let posts = JSON.parse(localStorage.getItem('beyoutrip_posts')) || [];

            // 데이터가 아예 없을 경우를 위한 기본 더미 데이터 생성
            if(posts.length === 0) {
                posts = [
                    {
                        id: 1,
                        title: '외국인 환자 유치를 위한 2026년 필수 마케팅 전략',
                        content: '의료 관광을 목적으로 한국을 방문하는 외국인들이 가장 먼저 확인하는 플랫폼은 어디일까요? 성공적인 유치를 위한 첫걸음을 안내합니다.',
                        category: '마케팅 트렌드',
                        thumbnail: 'https://images.unsplash.com/photo-1556761175-5973dc0f32d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                        date: '2026. 10. 22'
                    },
                    {
                        id: 2,
                        title: '샤오홍슈(小红书) 마케팅으로 매출 300% 상승한 피부과 사례',
                        content: '중국 고객들의 필수 앱인 샤오홍슈. 인플루언서 리뷰를 통해 어떻게 단기간에 예약률을 높였는지 실제 사례를 분석해 드립니다.',
                        category: '성공 사례',
                        thumbnail: 'https://images.unsplash.com/photo-1512436991641-6745cdb1723f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80',
                        date: '2026. 10. 15'
                    }
                ];
                localStorage.setItem('beyoutrip_posts', JSON.stringify(posts));
            }

            grid.innerHTML = ''; // 초기화

            // 게시글 카드 생성
            posts.forEach(post => {
                // 본문 텍스트만 추출 (HTML 태그 제거)
                const plainText = post.content ? post.content.replace(/(<([^>]+)>)/gi, "") : "";
                
                grid.innerHTML += `
                <article class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-200 hover:shadow-xl hover:border-brand-100 transition duration-300 group cursor-pointer">
                    <div class="h-56 bg-gray-200 overflow-hidden relative">
                        <img src="${post.thumbnail}" alt="썸네일" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        <span class="absolute top-4 left-4 bg-brand text-white text-xs font-bold px-3 py-1 rounded-full">${post.category}</span>
                    </div>
                    <div class="p-6">
                        <h3 class="text-xl font-bold text-gray-900 mb-3 line-clamp-2 group-hover:text-brand transition">${post.title}</h3>
                        <p class="text-gray-500 text-sm mb-4 line-clamp-3">${plainText}</p>
                        <div class="flex justify-between items-center text-sm text-gray-400">
                            <span>${post.date}</span>
                            <div class="space-x-2">
                                <button onclick="editPost(${post.id})" class="hover:text-brand transition">수정</button>
                                <button onclick="deletePost(${post.id})" class="hover:text-red-500 transition">삭제</button>
                            </div>
                        </div>
                    </div>
                </article>
                `;
            });
        }

        // 게시글 삭제 기능
        function deletePost(id) {
            if(confirm('정말 이 칼럼을 삭제하시겠습니까?')) {
                let posts = JSON.parse(localStorage.getItem('beyoutrip_posts')) || [];
                posts = posts.filter(post => post.id !== id);
                localStorage.setItem('beyoutrip_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        // 게시글 수정 기능 (수정 페이지로 이동)
        function editPost(id) {
            location.href = `admin-write.html?id=${id}`;
        }
    </script>
</body>
</html>
