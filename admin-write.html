<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 작성 (관리자) - 비유트립</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#FF5A79' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    
    <!-- Quill Rich Text Editor CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .ql-toolbar.ql-snow { border-radius: 0.5rem 0.5rem 0 0; background: #fff; border-color: #e5e7eb; padding: 12px; }
        .ql-container.ql-snow { border-radius: 0 0 0.5rem 0.5rem; background: #fff; border-color: #e5e7eb; min-height: 500px; font-size: 16px; font-family: 'Pretendard'; }
        .ql-editor { padding: 2rem; line-height: 1.8; }
        #thumbnail-preview { display: none; width: 100%; height: 250px; object-fit: cover; border-radius: 0.5rem; margin-top: 1rem; }
    </style>
</head>
<body class="text-gray-800">

    <!-- 관리자 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="w-16 h-16 bg-brand-50 text-brand rounded-full flex items-center justify-center text-2xl mx-auto mb-4"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-2xl font-bold mb-2">관리자 로그인</h2>
            <p class="text-gray-500 text-sm mb-6">칼럼 작성을 위해 비밀번호를 입력해주세요.</p>
            <!-- 임시 비밀번호: qlqldbdb1! -->
            <input type="password" id="admin-pw" class="w-full px-4 py-3 border border-gray-300 rounded-xl mb-4 focus:outline-none focus:border-brand" placeholder="비밀번호 입력" onkeyup="if(event.keyCode===13) checkAdmin()">
            <button onclick="checkAdmin()" class="w-full bg-brand text-white font-bold py-3 rounded-xl hover:bg-[#E0415F] transition">로그인</button>
        </div>
    </div>

    <!-- 에디터 메인 레이아웃 -->
    <div id="editor-wrap" class="hidden max-w-5xl mx-auto py-10 px-4">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900"><i class="fa-solid fa-pen-nib text-brand mr-2"></i>새 칼럼 작성</h1>
            <div class="space-x-2">
                <button onclick="location.href='column.html'" class="px-5 py-2.5 border border-gray-300 rounded-xl bg-white text-gray-700 font-medium hover:bg-gray-50 transition">취소</button>
                <button onclick="savePost()" class="px-5 py-2.5 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition shadow-lg">발행하기</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <input type="text" id="post-title" placeholder="제목을 입력하세요." class="w-full text-2xl font-bold border-b border-gray-200 pb-3 focus:outline-none focus:border-brand placeholder-gray-300">
                </div>
                
                <div class="shadow-sm">
                    <div id="toolbar">
                        <span class="ql-formats">
                            <select class="ql-header">
                                <option value="1">제목 1</option>
                                <option value="2">제목 2</option>
                                <option value="3">제목 3</option>
                                <option selected>본문</option>
                            </select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-bold"></button>
                            <button class="ql-italic"></button>
                            <button class="ql-underline"></button>
                            <button class="ql-strike"></button>
                        </span>
                        <span class="ql-formats">
                            <select class="ql-color"></select>
                            <select class="ql-background"></select>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-align" value=""></button>
                            <button class="ql-align" value="center"></button>
                            <button class="ql-align" value="right"></button>
                        </span>
                        <span class="ql-formats">
                            <button class="ql-image"></button>
                            <button class="ql-video"></button>
                            <button class="ql-link"></button>
                        </span>
                    </div>
                    <div id="editor"></div>
                </div>
            </div>

            <div class="space-y-6">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-900 mb-4">카테고리</h3>
                    <select id="post-category" class="w-full p-3 border border-gray-200 rounded-xl focus:outline-none focus:border-brand">
                        <option value="마케팅 트렌드">마케팅 트렌드</option>
                        <option value="성공 사례">성공 사례</option>
                        <option value="플랫폼 소식">플랫폼 소식</option>
                    </select>
                </div>

                <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-900 mb-4">썸네일 이미지</h3>
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center cursor-pointer hover:bg-gray-50 transition" onclick="document.getElementById('thumbnail-input').click();">
                        <i class="fa-regular fa-image text-3xl text-gray-400 mb-2"></i>
                        <p class="text-sm text-gray-500">클릭하여 이미지 업로드</p>
                    </div>
                    <input type="file" id="thumbnail-input" class="hidden" accept="image/*" onchange="previewThumbnail(event)">
                    <img id="thumbnail-preview" alt="썸네일 미리보기">
                </div>
            </div>
        </div>
    </div>

    <!-- Quill Editor Script -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script>
        // 1. 임시 관리자 로그인
        function checkAdmin() {
            const pw = document.getElementById('admin-pw').value;
            if(pw === 'qlqldbdb1!') {
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('editor-wrap').style.display = 'block';
                checkEditMode();
            } else {
                alert('비밀번호가 일치하지 않습니다.');
            }
        }

        // 2. 텍스트 에디터(Quill) 초기화
        var quill = new Quill('#editor', {
            modules: { toolbar: '#toolbar' },
            theme: 'snow',
            placeholder: '네이버 블로그처럼 자유롭게 글과 사진을 작성해보세요...'
        });

        // 3. 썸네일 이미지 미리보기 기능
        let currentThumbnail = '';
        function previewThumbnail(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('thumbnail-preview');
                output.src = reader.result;
                output.style.display = 'block';
                currentThumbnail = reader.result;
            };
            if(event.target.files[0]){
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // 수정 모드 확인 함수
        let editPostId = null;
        function checkEditMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if(id) {
                editPostId = parseInt(id);
                const posts = JSON.parse(localStorage.getItem('beyoutrip_posts')) || [];
                const postToEdit = posts.find(p => p.id === editPostId);
                
                if(postToEdit) {
                    document.getElementById('post-title').value = postToEdit.title;
                    document.getElementById('post-category').value = postToEdit.category;
                    quill.root.innerHTML = postToEdit.content;
                    
                    if(postToEdit.thumbnail) {
                        document.getElementById('thumbnail-preview').src = postToEdit.thumbnail;
                        document.getElementById('thumbnail-preview').style.display = 'block';
                        currentThumbnail = postToEdit.thumbnail;
                    }
                }
            }
        }

        // 4. 발행하기 (로컬 스토리지에 저장)
        function savePost() {
            const title = document.getElementById('post-title').value;
            const category = document.getElementById('post-category').value;
            
            // 핵심: Quill 에디터의 빈값(<p><br></p>)을 깔끔하게 치환
            let content = quill.root.innerHTML;
            if (content === '<p><br></p>') {
                content = '';
            }
            
            if(!title.trim()) {
                alert('제목을 입력해주세요.');
                return;
            }

            let posts = JSON.parse(localStorage.getItem('beyoutrip_posts')) || [];
            const defaultThumb = 'https://images.unsplash.com/photo-1556761175-5973dc0f32d7?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80';

            if (editPostId) {
                // 기존 글 수정
                posts = posts.map(post => {
                    if(post.id === editPostId) {
                        return {
                            ...post,
                            title: title,
                            category: category,
                            content: content,
                            thumbnail: currentThumbnail || post.thumbnail
                        };
                    }
                    return post;
                });
            } else {
                // 새 글 작성
                const newPost = {
                    id: Date.now(),
                    title: title,
                    category: category,
                    content: content,
                    thumbnail: currentThumbnail || defaultThumb,
                    date: new Date().toLocaleDateString('ko-KR')
                };
                posts.unshift(newPost); // 새 글을 맨 앞에 추가
            }

            localStorage.setItem('beyoutrip_posts', JSON.stringify(posts));
            alert('성공적으로 발행되었습니다.');
            location.href = 'column.html';
        }
    </script>
</body>
</html>
