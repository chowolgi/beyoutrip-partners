<body class="text-gray-800 pt-20">

    </article>

    <!-- 스크립트 영역 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPostDetail();
        });
// ... (이하 기존 자바스크립트 코드 동일) ...

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPostDetail();
        });

        function loadPostDetail() {
            // URL에서 id 파라미터 가져오기
            const urlParams = new URLSearchParams(window.location.search);
            const idParam = urlParams.get('id');
            
            if (!idParam) {
                alert('잘못된 접근입니다.');
                location.href = 'column.html';
                return;
            }

            const postId = parseInt(idParam);
            const posts = JSON.parse(localStorage.getItem('beyoutrip_posts')) || [];
            const post = posts.find(p => p.id === postId);

            if (!post) {
                alert('삭제되었거나 존재하지 않는 게시글입니다.');
                location.href = 'column.html';
                return;
            }

            // HTML 요소에 데이터 바인딩
            document.title = `${post.title} - 비유트립 파트너스`;
            document.getElementById('detail-title').innerText = post.title;
            document.getElementById('detail-category').innerText = post.category;
            document.getElementById('detail-date').innerText = post.date;
            document.getElementById('detail-thumbnail').src = post.thumbnail;
            
            // Quill 에디터로 작성한 HTML 본문 삽입
            document.getElementById('detail-content').innerHTML = post.content;
        }
    </script>
</body>
</html>
